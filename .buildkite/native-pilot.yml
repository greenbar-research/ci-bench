# Unscored Buildkite native (non-GHAC) pilot workload. Uploaded by
# bin/ci/pilot-bk-import when the REST build sets
# CI_BENCH_WORKFLOW=native-pilot.yml. Dependencies are cached with Buildkite
# Cache (.buildkite/native-cache.yml): exact-key restore and save of the same
# paths, plus a content digest checked after restore. Hosted cache volumes were
# dropped because they attach best-effort (a warm run got an empty volume).
steps:
  - label: ":buildkite: Native pilot ${CI_BENCH_PROFILE} ${CI_BENCH_CACHE_PHASE}"
    key: native-pilot
    image: "buildkite.namespace-images.com/agent-base@sha256:243c4015ea220c526b7976df88b037aff1930c1278d8d716b2f5f90247c72a08"
    agents:
      queue: linux-medium
    timeout_in_minutes: 50
    env:
      BUILDX_BUILDER: default
      CI_BENCH_RUNNER: buildkite-native
      CI_BENCH_NATIVE_CACHE: buildkite-cache
    command: bin/ci/pilot-native pilot
