# Unscored Buildkite GitHub Actions compatibility (GHAC) pilot input.
# Builds are created only through the REST API by bin/ci/pilot-buildkite with
# CI_BENCH_* build env; GitHub-triggered builds are disabled. The importer
# writes an explicit workflow_dispatch event snapshot and uploads the selected
# workflow with the pinned buildkite-gha runtime (see bin/ci/pilot-bk-import and
# docs/plans/pilot-github-buildkite.md). There is no shadow GitHub Actions run,
# so Buildkite build/job IDs, timestamps, and artifacts are collected separately.
steps:
  - label: ":github: Import unscored pilot workflow"
    key: gha-importer
    agents:
      queue: linux-medium
    env:
      BUILDKITE_GHA_TELEMETRY_DISABLED: "true"
    command: bin/ci/pilot-bk-import
