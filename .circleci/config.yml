# Unscored CircleCI pilot target. It runs only when the controller
# (bin/ci/pilot-circleci) triggers a pipeline through the API with
# expected_sha set; pushes and pipelines without parameters run nothing.
# bin/ci/pilot-native mirrors .github/workflows/probe.yml and pilot.yml step
# for step. The machine image is CircleCI's Ubuntu 24.04 image on large.gen2
# (4 vCPU / 16 GiB). Docker uses the local daemon; docker_layer_caching stays
# off.
version: 2.1

parameters:
  mode:
    type: enum
    enum: [probe, pilot]
    default: probe
  expected_sha:
    type: string
    default: ""
  profile:
    type: enum
    enum: [smoke, full]
    default: smoke
  cache_phase:
    type: enum
    enum: [cold, warm]
    default: cold
  cache_epoch:
    type: string
    default: none

executors:
  pilot:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: false
    resource_class: large.gen2
    environment:
      BUILDX_BUILDER: default
      CI_BENCH_RUNNER: circleci
      CI_BENCH_EXPECTED_SHA: << pipeline.parameters.expected_sha >>

jobs:
  probe:
    executor: pilot
    steps:
      - checkout
      - run:
          name: Orchestration probe
          command: bin/ci/pilot-native probe
      - store_artifacts:
          path: tmp/pilot
          destination: pilot
          when: always

  pilot:
    executor: pilot
    environment:
      CI_BENCH_PROFILE: << pipeline.parameters.profile >>
      CI_BENCH_CACHE_PHASE: << pipeline.parameters.cache_phase >>
      CI_BENCH_CACHE_EPOCH: << pipeline.parameters.cache_epoch >>
    steps:
      - checkout
      # The same logical entry as actions/cache in pilot.yml. A sentinel
      # written only after a successful run proves the hit or miss.
      - restore_cache:
          keys:
            - ci-bench-pilot-<< pipeline.parameters.cache_epoch >>-<< pipeline.parameters.profile >>-circleci-Linux-{{ checksum "Gemfile.lock" }}-{{ checksum "package-lock.json" }}
      - run:
          name: Unscored pilot workload
          no_output_timeout: 50m
          command: bin/ci/pilot-native pilot
      - save_cache:
          key: ci-bench-pilot-<< pipeline.parameters.cache_epoch >>-<< pipeline.parameters.profile >>-circleci-Linux-{{ checksum "Gemfile.lock" }}-{{ checksum "package-lock.json" }}
          paths:
            - vendor/bundle
            - tmp/ci-bench-cache
      - store_artifacts:
          path: tmp/pilot
          destination: pilot
          when: always

workflows:
  probe:
    when:
      and:
        - equal: [probe, << pipeline.parameters.mode >>]
        - not:
            equal: ["", << pipeline.parameters.expected_sha >>]
    jobs:
      - probe
  pilot:
    when:
      and:
        - equal: [pilot, << pipeline.parameters.mode >>]
        - not:
            equal: ["", << pipeline.parameters.expected_sha >>]
    jobs:
      - pilot
