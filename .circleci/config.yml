# Unscored CircleCI pilot target. It runs only when the controller
# (bin/ci/pilot-circleci) triggers a pipeline through the API with
# expected_sha set; pushes and pipelines without parameters run nothing.
# bin/ci/pilot-native mirrors .github/workflows/probe.yml and pilot.yml step
# for step. The machine image is CircleCI's dated Ubuntu 24.04 image
# 2026.05.1 (not the mutable :current tag) on large.gen2 (4 vCPU / 16 GiB).
# Docker uses the local daemon; docker_layer_caching stays off.
# store_artifacts runs after a failed step without a when key; CircleCI does
# not accept when on it.
version: 2.1

parameters:
  mode:
    type: enum
    enum: [probe, pilot]
    default: probe
  expected_sha:
    type: string
    default: ""
  profile:
    type: enum
    enum: [smoke, full]
    default: smoke
  cache_phase:
    type: enum
    enum: [cold, warm]
    default: cold
  cache_epoch:
    type: string
    default: none

commands:
  # The organization disables deploy keys, so CircleCI's SSH checkout has no
  # key. This fetches the public repository anonymously over HTTPS, checks out
  # exactly expected_sha, and verifies the pipeline revision and the immutable
  # tag pilot/<sha> name the same commit.
  pinned-checkout:
    steps:
      - run:
          name: Check out expected commit (anonymous HTTPS)
          command: |
            set -euo pipefail
            sha="$CI_BENCH_EXPECTED_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full commit SHA" >&2; exit 1; }
            [[ "$CIRCLE_SHA1" == "$sha" ]] || { echo "pipeline revision $CIRCLE_SHA1 is not $sha" >&2; exit 1; }
            url=https://github.com/greenbar-research/ci-bench.git
            tagged="$(git ls-remote "$url" "refs/tags/pilot/$sha" | cut -f1)"
            [[ "$tagged" == "$sha" ]] || { echo "tag pilot/$sha names ${tagged:-nothing}, not $sha" >&2; exit 1; }
            mkdir -p ~/project && cd ~/project
            git init -q .
            git remote add origin "$url"
            git fetch -q --depth 1 origin "$sha"
            git checkout -q --detach FETCH_HEAD
            [[ "$(git rev-parse HEAD)" == "$sha" ]]

executors:
  pilot:
    machine:
      image: ubuntu-2404:2026.05.1
      docker_layer_caching: false
    resource_class: large.gen2
    environment:
      BUILDX_BUILDER: default
      CI_BENCH_RUNNER: circleci
      CI_BENCH_EXPECTED_SHA: << pipeline.parameters.expected_sha >>

jobs:
  probe:
    executor: pilot
    steps:
      - pinned-checkout
      - run:
          name: Orchestration probe
          command: bin/ci/pilot-native probe
      - store_artifacts:
          path: tmp/pilot
          destination: pilot

  pilot:
    executor: pilot
    environment:
      CI_BENCH_PROFILE: << pipeline.parameters.profile >>
      CI_BENCH_CACHE_PHASE: << pipeline.parameters.cache_phase >>
      CI_BENCH_CACHE_EPOCH: << pipeline.parameters.cache_epoch >>
    steps:
      - pinned-checkout
      # The same logical entry as actions/cache in pilot.yml. A sentinel
      # written only after a successful run proves the hit or miss.
      - restore_cache:
          keys:
            - ci-bench-pilot-<< pipeline.parameters.cache_epoch >>-<< pipeline.parameters.profile >>-circleci-Linux-{{ checksum "Gemfile.lock" }}-{{ checksum "package-lock.json" }}
      - run:
          name: Unscored pilot workload
          no_output_timeout: 50m
          command: bin/ci/pilot-native pilot
      - save_cache:
          key: ci-bench-pilot-<< pipeline.parameters.cache_epoch >>-<< pipeline.parameters.profile >>-circleci-Linux-{{ checksum "Gemfile.lock" }}-{{ checksum "package-lock.json" }}
          paths:
            - vendor/bundle
            - tmp/ci-bench-cache
      - store_artifacts:
          path: tmp/pilot
          destination: pilot

workflows:
  probe:
    when:
      and:
        - equal: [probe, << pipeline.parameters.mode >>]
        - not:
            equal: ["", << pipeline.parameters.expected_sha >>]
    jobs:
      - probe:
          # CircleCI runs no job in a tag pipeline without tag filters; the
          # controller pins config and checkout to the immutable pilot tag.
          filters:
            tags:
              only: /^pilot\/[0-9a-f]{40}$/
            branches:
              ignore: /.*/
  pilot:
    when:
      and:
        - equal: [pilot, << pipeline.parameters.mode >>]
        - not:
            equal: ["", << pipeline.parameters.expected_sha >>]
    jobs:
      - pilot:
          # CircleCI runs no job in a tag pipeline without tag filters; the
          # controller pins config and checkout to the immutable pilot tag.
          filters:
            tags:
              only: /^pilot\/[0-9a-f]{40}$/
            branches:
              ignore: /.*/
