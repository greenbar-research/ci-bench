name: ci-bench

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ci_bench_development
      POSTGRES_PASSWORD: ci_bench
      POSTGRES_USER: ci_bench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_bench -d ci_bench_development"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:8.0.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:6379:6379"
