name: Unscored orchestration probe

# Pure short orchestration probe for the pilot in
# docs/plans/pilot-github-buildkite.md: checkout, runner identity record, a
# completion marker, and evidence upload. No dependencies or services.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA the dispatched ref must resolve to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-bench-pilot
  cancel-in-progress: false

jobs:
  probe:
    name: Orchestration probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_BENCH_EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Mark job start
        shell: bash
        run: |
          phases="$RUNNER_TEMP/ci-bench-phases.tsv"
          echo "CI_BENCH_PHASES=$phases" >> "$GITHUB_ENV"
          now="$(date -u +%s%3N)"
          printf '%s\tjob\tstart\n%s\tcheckout\tstart\n' "$now" "$now" > "$phases"

      - name: Check out dispatched revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Record runner identity
        run: |
          bin/ci/pilot-mark checkout:end identity:start
          bin/ci/pilot-runner
          bin/ci/pilot-mark identity:end

      - name: Write completion marker
        run: |
          bin/ci/pilot-mark marker:start
          git rev-parse HEAD > tmp/pilot/marker.txt
          bin/ci/pilot-mark marker:end

      - name: Collect in-job evidence
        if: ${{ always() }}
        run: |
          bin/ci/pilot-mark artifact:start
          mkdir -p tmp/pilot
          cp "$CI_BENCH_PHASES" tmp/pilot/phases.tsv || true
          { git rev-parse HEAD; git status --porcelain; } > tmp/pilot/source.txt
          (cd tmp/pilot && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: tmp/pilot/
